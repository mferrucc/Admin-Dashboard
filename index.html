<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">
        <div class="title-box">
            <img src="media/view-dashboard.svg" alt="dashboard logo" class="title-logo">
            <h2>Dashboard</h2>
        </div>
        <div class="menu">
            <div>
                <img src="media/home-circle.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Home</p>
            </div>

            <div>
                <img src="media/profile.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Profile</p>
            </div>

            <div>
                <img src="media/message.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Messages</p>
            </div>

            <div>
                <img src="media/history.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>History</p>
            </div>

            <div>
                <img src="media/task.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Tasks</p>
            </div>

            <div>
                <img src="media/community.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Commmunities</p>
            </div>
            <!-- Empty space -->
            <div class="menuicon">
            </div>
            <div class="menu-item"></div>

            <div>
                <img src="media/settings.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Settings</p>
            </div>

            <div>
                <img src="media/support.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Support</p>
            </div>

            <div>
                <img src="media/privacy.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Privacy</p>
            </div>
        </div>
    </div>
    <div class="header">
        <div class="header-top">
            <div>
                <img src="media/search.svg" alt="search icon">
            </div>
            <div>
                <input type="text" id="SearchBar">
            </div>
            <div>
                <img src="media/alert.svg" alt="">
            </div>
            <div>
                <img src="media/avatar.svg" alt="">
            </div>
            <div>
                <p>The Odin Project</p>
            </div>
        </div>
        <div class="header-bottom"></div>
    </div>
    <div class="main-content">

    </div>
</body>

</html>
