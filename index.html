<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

            <img src="media/view-dashboard.svg" alt="dashboard logo" class="title-logo">

        </div>
        <div class="menu">
            <div>
                <img src="media/home-circle.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Home</p>
            </div>

            <div>
                <img src="media/profile.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Profile</p>
            </div>

            <div>
                <img src="media/message.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Messages</p>
            </div>

            <div>
                <img src="media/history.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>History</p>
            </div>

            <div>
                <img src="media/task.svg" alt="" class="menu-icon">
            </div>
            <div class="menu-item">
                <p>Tasks</p>
            </div>

                <img src="media/community.svg" alt="" class="menu-icon">
